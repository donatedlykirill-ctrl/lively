name: Build Official Lively Portable

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore
      run: nuget restore src/Lively/Lively.sln

    - name: Publish Solution
      run: |
        msbuild src/Lively/Lively.sln `
          /t:Publish `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:PublishDir=publish\ `
          /m

    - name: Remove debug symbols
      shell: pwsh
      run: |
        Get-ChildItem publish -Recurse -Filter *.pdb | Remove-Item -Force

    - name: Upload Portable Build
      uses: actions/upload-artifact@v4
      with:
        name: Lively-Portable
        path: publish/
