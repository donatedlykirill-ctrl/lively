name: Build Lively

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore
      run: nuget restore src/Lively/Lively.sln

    - name: Build
      run: msbuild src/Lively/Lively.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Upload EXE only
      uses: actions/upload-artifact@v4
      with:
        name: Lively-EXE
        path: src/Lively/bin/x64/Release/Lively.exe
