name: Build Lively Portable

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: microsoft/setup-msbuild@v2

    - uses: NuGet/setup-nuget@v2

    - name: Restore
      run: nuget restore src/Lively/Lively.sln

    - name: Build
      run: msbuild src/Lively/Lively.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Copy full build output
      shell: pwsh
      run: |
        $root = "src/Lively/Lively/bin/x64/Release"
        $folder = Get-ChildItem $root -Directory |
                  Where-Object { $_.Name -like "net*-windows*" } |
                  Select-Object -First 1

        if (-not $folder) {
          Write-Error "Build output folder not found!"
          exit 1
        }

        Copy-Item "$($folder.FullName)" publish -Recurse -Force

    - name: Remove debug symbols
      shell: pwsh
      run: |
        Get-ChildItem publish -Recurse -Filter *.pdb | Remove-Item -Force

    - uses: actions/upload-artifact@v4
      with:
        name: Lively-Portable
        path: publish/
