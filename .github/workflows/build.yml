name: Build Full Lively Portable

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore src/Lively/Lively.sln

    - name: Build full solution
      run: msbuild src/Lively/Lively.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Copy Release Output
      shell: pwsh
      run: |
        $source = Get-ChildItem "src/Lively/Lively/bin/x64/Release" -Directory |
                  Where-Object { $_.Name -like "net*-windows*" } |
                  Select-Object -First 1

        if (-not $source) {
          Write-Error "Release folder not found!"
          exit 1
        }

        New-Item -ItemType Directory -Path publish -Force
        Copy-Item "$($source.FullName)\*" publish -Recurse -Force

    - name: Remove debug symbols
      shell: pwsh
      run: |
        Get-ChildItem publish -Recurse -Filter *.pdb | Remove-Item -Force

    - name: Upload Portable Build
      uses: actions/upload-artifact@v4
      with:
        name: Lively-Portable
        path: publish/
